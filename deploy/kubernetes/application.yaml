---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: database-backup
  namespace: teslamate
spec:
  schedule: "0 11 * * *"
  timeZone: Etc/UTC
  suspend: __BACKUP_SUSPEND__
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: database-backup
            azure.workload.identity/use: "true"
        spec:
          serviceAccountName: teslamate
          restartPolicy: Never
          nodeSelector:
            unicorns.dev/workload: applications
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.azure.com/scalesetpriority
                        operator: In
                        values: [spot]
          tolerations:
            - key: kubernetes.azure.com/scalesetpriority
              operator: Equal
              value: spot
              effect: NoSchedule
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: __BACKUP_IMAGE__
              env:
                - name: PGHOST
                  value: database
                - name: PGDATABASE
                  value: teslamate
                - name: BACKUP_ACCOUNT
                  value: __TESLAMATE_BACKUP_ACCOUNT__
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: secrets
                  mountPath: /mnt/secrets-store
                  readOnly: true
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
            - name: secrets
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: teslamate
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database
  namespace: teslamate
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [teslamate, grafana, database-backup]
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto
  namespace: teslamate
spec:
  podSelector:
    matchLabels:
      app: mosquitto
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: teslamate
      ports:
        - protocol: TCP
          port: 1883
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teslamate-private
  namespace: teslamate
spec:
  ingressClassName: tailnet
  rules:
    - host: teslamate.benzhang.dev
      http:
        paths:
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
